name: Update Ilmala Lunch Menu

on:
  schedule:
    # 00:17 UTC = 03:17 Helsinki in summer (EEST, UTC+3) / 02:17 in winter (EET, UTC+2).
    # Runs Mon-Fri. Off-the-hour minute (17) is far less contended than
    # minute 0, so GitHub dispatches it closer to on-time; the early-morning
    # slot also leaves hours of slack before people check the menu, even if
    # GitHub delays the run. Adjust the hour if you want it earlier/later.
    - cron: '17 0 * * 1-5'
    # Backup run, one hour later, in case GitHub just never delivers the
    # trigger above -- confirmed happening on 2026-08-27 (a Thursday, so not
    # a cron-syntax issue): every other weekday since 2026-08-06 had a
    # "schedule" run recorded, but that day had none at all, only a manual
    # workflow_dispatch. GitHub documents scheduled ("cron") triggers as
    # best-effort and occasionally dropped outright under platform load, with
    # no error or retry on their side. The "Fetch & translate" step below
    # skips doing anything if today's menu.json is already dated today, so
    # this is a no-op (no extra commit) on every normal day where the run
    # above already succeeded.
    - cron: '17 1 * * 1-5'
    # Monday-only retry window, starting 04:17 UTC = 07:17 Helsinki (EEST) /
    # 06:17 (EET). lounaat.info's Dylan restaurants (Luft, La Ilma) publish
    # each week's fresh Monday menu some time mid-morning, not by the 03:17
    # run above -- confirmed unavailable as late as 09:47 Helsinki on
    # 2026-08-10 and still unavailable at 10:14 on 2026-08-24. Rather than
    # gamble on one fixed time (which is also at the mercy of GitHub's own
    # scheduling slop), the "Fetch & translate" step below rechecks every
    # ~25 min for up to 4 hours, committing as soon as Dylan's menu appears
    # instead of waiting out the full window regardless. This retry behavior
    # also kicks in for a manual workflow_dispatch run started in the same
    # Monday-morning window (not just this exact cron) -- on 2026-08-24 this
    # scheduled run was manually cancelled mid-retry and replaced by a
    # one-shot manual rerun that landed on the placeholder and overwrote the
    # in-progress retry with a permanent "unavailable", so a manual rerun
    # during this window needs to retry too, not just this cron trigger.
    - cron: '17 4 * * 1'
  workflow_dispatch: {}   # lets you trigger a manual run from the Actions tab

permissions:
  contents: write

concurrency:
  group: update-menu
  cancel-in-progress: false

jobs:
  update-menu:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check whether the backup run is actually needed
        id: freshness
        run: |
          # Only the backup cron (see schedule comment above) skips -- the
          # primary run, the Monday retry, and any manual dispatch should
          # always do real work. "Today" uses the same fixed UTC+3 offset as
          # the Python script (see main()), not true Europe/Helsinki tzdata,
          # so the two agree on what date they're looking for.
          if [ "${{ github.event.schedule }}" = "17 1 * * 1-5" ]; then
            today=$(date -u -d '+3 hours' +%F)
            has_today=$(jq -r --arg d "$today" '.days[$d] // empty | "yes"' docs/menu.json 2>/dev/null || echo "")
            if [ "$has_today" = "yes" ]; then
              echo "menu.json already has a $today entry -- primary run succeeded, skipping backup."
              echo "skip=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Set up Python
        if: steps.freshness.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.freshness.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: Fetch & translate today's menu
        if: steps.freshness.outputs.skip != 'true'
        env:
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
        run: |
          python scripts/update_menu.py
          # Monday-morning retry window (see schedule comment above), roughly
          # 04:00-09:00 UTC -- covers both the dedicated retry cron and any
          # workflow_dispatch run (manual or otherwise) that happens to land
          # in this window, so a manual rerun can't cut a retry short again.
          now_dow=$(date -u +%u)   # 1 = Monday
          now_hour=$(date -u +%H)
          if [ "$now_dow" = "1" ] && [ "$now_hour" -ge 4 ] && [ "$now_hour" -lt 9 ]; then
            # Keep re-fetching until Dylan's menu is no longer "unavailable"
            # or we hit the cutoff, then fall through to the commit step
            # either way.
            cutoff=$(( $(date -u +%s) + 4*3600 ))
            while [ "$(date -u +%s)" -lt "$cutoff" ]; do
              today=$(date -u -d '+3 hours' +%F)
              still_missing=$(python -c "import json; d = json.load(open('docs/menu.json', encoding='utf-8')); restos = d.get('days', {}).get('$today', {}).get('restaurants', {}); print(any(v.get('unavailable') for k, v in restos.items() if k in ('luft', 'lailma')))")
              if [ "$still_missing" = "False" ]; then
                echo "Dylan menus are populated, stopping retry loop."
                break
              fi
              echo "Dylan menus still unavailable, retrying in 25 min..."
              sleep 1500
              python scripts/update_menu.py
            done
          fi

      - name: Commit updated menu.json
        if: steps.freshness.outputs.skip != 'true'
        run: |
          git config user.name "menu-bot"
          git config user.email "menu-bot@users.noreply.github.com"
          git add docs/menu.json docs/translation_cache.json
          git diff --quiet --cached || git commit -m "chore: update lunch menu $(date -u +%F)"
          git push
