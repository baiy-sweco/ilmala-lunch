name: Update Ilmala Lunch Menu

on:
  schedule:
    # 06:00 UTC = 09:00 Helsinki in summer (EEST, UTC+3) / 08:00 in winter (EET, UTC+2).
    # Runs Mon-Fri only. Adjust the hour if you want it earlier/later local time.
    - cron: '0 6 * * 1-5'
  workflow_dispatch: {}   # lets you trigger a manual run from the Actions tab

permissions:
  contents: write

concurrency:
  group: update-menu
  cancel-in-progress: false

jobs:
  update-menu:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch & translate today's menu
        env:
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
        run: python scripts/update_menu.py

      - name: Commit updated menu.json
        run: |
          git config user.name "menu-bot"
          git config user.email "menu-bot@users.noreply.github.com"
          git add docs/menu.json docs/translation_cache.json
          git diff --quiet --cached || git commit -m "chore: update lunch menu $(date -u +%F)"
          git push
