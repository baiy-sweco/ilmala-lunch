name: Update Ilmala Lunch Menu

on:
  schedule:
    # 00:17 UTC = 03:17 Helsinki in summer (EEST, UTC+3) / 02:17 in winter (EET, UTC+2).
    # Runs Mon-Fri. Off-the-hour minute (17) is far less contended than
    # minute 0, so GitHub dispatches it closer to on-time; the early-morning
    # slot also leaves hours of slack before people check the menu, even if
    # GitHub delays the run. Adjust the hour if you want it earlier/later.
    - cron: '17 0 * * 1-5'
    # Monday-only retry window, starting 04:17 UTC = 07:17 Helsinki (EEST) /
    # 06:17 (EET). lounaat.info's Dylan restaurants (Luft, La Ilma) publish
    # each week's fresh Monday menu some time mid-morning, not by the 03:17
    # run above -- confirmed unavailable as late as 09:47 Helsinki on
    # 2026-08-10, only actually up by ~10:52. Rather than gamble on one fixed
    # time (which is also at the mercy of GitHub's own scheduling slop), the
    # "Fetch & translate" step below detects this specific trigger and
    # rechecks every ~25 min for up to 4 hours, committing as soon as Dylan's
    # menu appears instead of waiting out the full window regardless.
    - cron: '17 4 * * 1'
  workflow_dispatch: {}   # lets you trigger a manual run from the Actions tab

permissions:
  contents: write

concurrency:
  group: update-menu
  cancel-in-progress: false

jobs:
  update-menu:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch & translate today's menu
        env:
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
        run: |
          python scripts/update_menu.py
          if [ "${{ github.event.schedule }}" = "17 4 * * 1" ]; then
            # Monday retry window (see schedule comment above): keep
            # re-fetching until Dylan's menu is no longer "unavailable" or we
            # hit the cutoff, then fall through to the commit step either way.
            cutoff=$(( $(date -u +%s) + 4*3600 ))
            while [ "$(date -u +%s)" -lt "$cutoff" ]; do
              still_missing=$(python -c "import json; d = json.load(open('docs/menu.json', encoding='utf-8')); print(any(v.get('unavailable') for k, v in d['restaurants'].items() if k in ('luft', 'lailma')))")
              if [ "$still_missing" = "False" ]; then
                echo "Dylan menus are populated, stopping retry loop."
                break
              fi
              echo "Dylan menus still unavailable, retrying in 25 min..."
              sleep 1500
              python scripts/update_menu.py
            done
          fi

      - name: Commit updated menu.json
        run: |
          git config user.name "menu-bot"
          git config user.email "menu-bot@users.noreply.github.com"
          git add docs/menu.json docs/translation_cache.json
          git diff --quiet --cached || git commit -m "chore: update lunch menu $(date -u +%F)"
          git push
